name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Apply poem auto-invert patch
        run: |
          cat > antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/FeatureGuard.java <<'JAVA_EOF_1'
          package io.github.wumisc.antiburn;

          import java.util.concurrent.ConcurrentHashMap;

          /**
           * 异常熔断隔离（补写实现：原仓库 README 与代码注释提及该组件，但源文件未随仓库
           * 提交，此处按注释写明的语义实现）。
           *
           * 语义：以 key 为单位托管一段逻辑的执行。逻辑正常返回则清零该 key 的失败计数；
           * 逻辑抛异常则计数加一，累计达到 {@link #MAX_FAILURES} 次后该 key 被熔断，
           * 后续调用直接跳过、不再执行，直到进程重启。任何一处功能的反复异常只会熔断
           * 它自己，不影响其它功能，更不会把宿主进程（SystemUI）打崩。
           */
          public final class FeatureGuard {

              private static final int MAX_FAILURES = 3;

              private static final ConcurrentHashMap<String, Integer> FAILURES =
                      new ConcurrentHashMap<>();

              private FeatureGuard() {
              }

              /** 在熔断保护下执行 task；已熔断的 key 直接跳过。 */
              public static void guard(String key, Runnable task) {
                  Integer fails = FAILURES.get(key);
                  if (fails != null && fails >= MAX_FAILURES) {
                      return; // 已熔断：跳过执行，等待进程重启恢复
                  }
                  try {
                      task.run();
                      if (fails != null && fails > 0) {
                          FAILURES.remove(key); // 成功一次即清零
                      }
                  } catch (Throwable t) {
                      int n = (fails == null ? 0 : fails) + 1;
                      FAILURES.put(key, n);
                      try {
                          XposedInit.diag("FeatureGuard[" + key + "] 异常 " + n + "/"
                                  + MAX_FAILURES + ": " + t);
                          if (n >= MAX_FAILURES) {
                              XposedInit.diagForce("FeatureGuard[" + key + "] 已熔断，"
                                      + "该功能停用至 SystemUI 重启");
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }

              /** 该 key 是否已被熔断。 */
              public static boolean isTripped(String key) {
                  Integer fails = FAILURES.get(key);
                  return fails != null && fails >= MAX_FAILURES;
              }
          }
          JAVA_EOF_1
          cat > antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/PixelShift.java <<'JAVA_EOF_2'
          package io.github.wumisc.antiburn;

          import android.view.View;

          /**
           * 像素偏移防烧屏引擎（补写实现：原仓库 README 与代码注释提及该组件，但源文件
           * 未随仓库提交，此处按注释写明的语义实现）。
           *
           * 与 AOSP BurnInProtectionController 同思路：把状态栏/导航栏容器缓慢平移
           * ±{@link #MAX_SHIFT_PX} px，视觉几乎无感，但图标轮廓不再长期压在同一批像素上。
           * Controller 的主循环约每 2 秒调用一次 {@link #tick()}，本引擎每
           * {@link #TICKS_PER_STEP} 次 tick 才前进一步（约 1 分钟一步），走完一个
           * 5×5 的巡回网格约 25 分钟，足够分摊轮廓又不会肉眼可见地漂移。
           *
           * guardCenter 语义：巡回路径始终围绕原点（偏移有界、均值回归中心），本实现恒
           * 为 true；Controller 仅将其用于诊断日志，不参与控制逻辑。
           *
           * 全部方法只操作 View 的 translationX/translationY，shutdown 时归零还原。
           * 状态为进程级静态单例，与 Controller 的静态调用方式一致。
           */
          public final class PixelShift {

              private static final int MAX_SHIFT_PX = 2;
              private static final int TICKS_PER_STEP = 30; // 30 × ~2s ≈ 60s 一步

              /** 巡回网格坐标（-2..2），蛇形遍历，一圈 25 步后回到原点。 */
              private static final int[] PATH_X = new int[25];
              private static final int[] PATH_Y = new int[25];

              static {
                  int i = 0;
                  for (int y = -MAX_SHIFT_PX; y <= MAX_SHIFT_PX; y++) {
                      if ((y & 1) == 0) {
                          for (int x = -MAX_SHIFT_PX; x <= MAX_SHIFT_PX; x++) {
                              PATH_X[i] = x;
                              PATH_Y[i] = y;
                              i++;
                          }
                      } else {
                          for (int x = MAX_SHIFT_PX; x >= -MAX_SHIFT_PX; x--) {
                              PATH_X[i] = x;
                              PATH_Y[i] = y;
                              i++;
                          }
                      }
                  }
              }

              private static View statusView;
              private static View navView;
              private static String style = "";
              private static int tickCount;
              private static int stepIndex;
              private static boolean active;

              private PixelShift() {
              }

              /** 记录当前 UI 方案（aosp / miuix 等）；仅存值与参与日志，不改变偏移算法。 */
              public static void setStyle(String s) {
                  style = s == null ? "" : s;
              }

              /** 偏移是否始终围绕中心有界巡回（本实现的设计保证）。 */
              public static boolean isGuardCenter() {
                  return true;
              }

              /** 绑定要平移的状态栏/导航栏容器；每次 Controller 循环都会调用，幂等。 */
              public static void bind(View status, View nav) {
                  statusView = status;
                  navView = nav;
                  if (status != null || nav != null) {
                      active = true;
                  }
              }

              /** 推进偏移节拍：累计 TICKS_PER_STEP 次后沿巡回网格前进一步并应用平移。 */
              public static void tick() {
                  if (!active) {
                      return;
                  }
                  if (++tickCount < TICKS_PER_STEP) {
                      return;
                  }
                  tickCount = 0;
                  stepIndex = (stepIndex + 1) % PATH_X.length;
                  apply(PATH_X[stepIndex], PATH_Y[stepIndex]);
              }

              /** 是否已绑定并处于工作状态。 */
              public static boolean isActive() {
                  return active;
              }

              /** 停止偏移并把平移归零，还原容器原位。 */
              public static void shutdown() {
                  apply(0, 0);
                  statusView = null;
                  navView = null;
                  active = false;
                  tickCount = 0;
                  stepIndex = 0;
              }

              private static void apply(int dx, int dy) {
                  try {
                      if (statusView != null) {
                          statusView.setTranslationX(dx);
                          statusView.setTranslationY(dy);
                      }
                  } catch (Throwable ignored) {
                  }
                  try {
                      if (navView != null) {
                          navView.setTranslationX(dx);
                          navView.setTranslationY(dy);
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
          JAVA_EOF_2
          ls -la antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/FeatureGuard.java antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/PixelShift.java
          cat > antiburn-lite/app/src/main/res/drawable/ic_launcher_fg.xml <<'XML_EOF_1'
          <!-- 补写资源：原仓库的自适应图标引用了 @drawable/ic_launcher_fg，但该文件未随
               仓库提交。此处按图标背景色 #162233（深蓝）配浅色前景，画一个简洁的
               “护盾 + 对勾”矢量图（防烧屏 = 守护屏幕），仅影响桌面图标外观。 -->
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E8F1FF"
                  android:pathData="M54,26 L78,34 L78,52 C78,68 68,78 54,84 C40,78 30,68 30,52 L30,34 Z" />
              <path
                  android:fillColor="#162233"
                  android:pathData="M47,55 L38,46 L35,49 L47,61 L73,35 L70,32 Z" />
          </vector>
          XML_EOF_1
          ls -la antiburn-lite/app/src/main/res/drawable/ic_launcher_fg.xml
          cat > /tmp/antiburn-poem.patch <<'PATCH'
          diff --git a/antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/Controller.java b/antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/Controller.java
          index c6ad5f5..ec3d445 100644
          --- a/antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/Controller.java
          +++ b/antiburn-lite/app/src/main/java/io/github/wumisc/antiburn/Controller.java
          @@ -519,7 +519,7 @@ public final class Controller {
               }
 
               /** 状态栏隐藏时轮播励志古诗：一次显示一首，自动折行最多 3 行，
          -     *  随机顺序播放（播完一轮重新洗牌），背景反色自适应（浅背景→深字，深背景→浅字）。 */
          +     *  随机顺序播放（播完一轮重新洗牌），壁纸亮度自适应反色（浅壁纸→深字，深壁纸→浅字）。 */
               static class PoemScrollView extends View {
                   private static final long FRAME_MS = 40;    // 25fps（与弹幕版滚动一致，流畅省电）
                   private static final float SPEED_PX = 120f; // 每秒滚动像素（弹幕横向滚动，120px/s 明快）
          @@ -617,7 +617,12 @@ public final class Controller {
                       invalidate();
                   }
 
          -        /** 采样状态栏背景亮度：浅背景→深字，深背景→浅字 */
          +        /** 采样壁纸在状态栏区域的平均亮度：浅背景→深字，深背景→浅字（古诗自动反色）。
          +         *  原理：古诗显示期间状态栏内容被透明化、其自身背景不可见（多为透明），直接
          +         *  对着壁纸显示。状态栏容器的 getBackground() 通常为空/非纯色，取不到真实
          +         *  壁纸颜色，因此改用 WallpaperManager 的原色提示（getWallpaperColors 的
          +         *  primaryColor 即壁纸平均色）估算背景亮度；每 5 秒重采，切换壁纸自动跟随。
          +         *  系统栏外观标志（深色图标 = 浅背景）为同级兜底；都拿不到才按深色背景处理。 */
                   private void updateColor() {
                       int bg = sampleStatusBg();
                       boolean light = (Color.red(bg) * 299 + Color.green(bg) * 587 + Color.blue(bg) * 114) / 1000 >= 128;
          @@ -625,6 +630,20 @@ public final class Controller {
                   }
 
                   private int sampleStatusBg() {
          +            // 1) 首选：壁纸原色提示（系统按壁纸算好的平均色，SystemUI 可直接取）
          +            try {
          +                android.app.WallpaperManager wm = android.app.WallpaperManager
          +                        .getInstance(getContext());
          +                if (wm != null) {
          +                    android.app.WallpaperColors wc = wm.getWallpaperColors(
          +                            android.app.WallpaperManager.FLAG_SYSTEM);
          +                    if (wc != null && wc.getPrimaryColor() != null) {
          +                        return wc.getPrimaryColor().toArgb();
          +                    }
          +                }
          +            } catch (Throwable ignored) {
          +            }
          +            // 2) 兜底：状态栏容器的纯色背景（少数 ROM 确实给它上色时才有效）
                       try {
                           android.graphics.drawable.Drawable d = statusView.getBackground();
                           if (d instanceof android.graphics.drawable.ColorDrawable) {
          @@ -632,7 +651,17 @@ public final class Controller {
                           }
                       } catch (Throwable ignored) {
                       }
          -            return 0xFF1A1A1A; // 拿不到按深色背景，显示浅色文字
          +            // 3) 兜底：系统栏外观标志——深色图标意味着浅背景
          +            try {
          +                View root = statusView.getRootView();
          +                if (root != null && android.os.Build.VERSION.SDK_INT >= 23
          +                        && (root.getSystemUiVisibility()
          +                        & View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR) != 0) {
          +                    return 0xFFF5F5F5;
          +                }
          +            } catch (Throwable ignored) {
          +            }
          +            return 0xFF1A1A1A; // 都拿不到按深色背景，显示浅色文字
                   }
               }
 
          PATCH
          git apply /tmp/antiburn-poem.patch
          git diff --stat

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: antiburn-lite
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiburn-autoinvert
          path: antiburn-lite/app/build/outputs/apk/debug/app-debug.apk
