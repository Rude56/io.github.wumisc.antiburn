# v2.6.0 poem-worm CI trigger (json exception fix)
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Assemble workflow from chunks
        run: |
          if [ -f muse-workflow/build.part1.txt ] && [ -f muse-workflow/build.part2.txt ]; then
            P1=$(python3 -c "import urllib.parse; print(urllib.parse.unquote(open('muse-workflow/build.part1.txt').read()))")
            P2=$(python3 -c "import urllib.parse; print(urllib.parse.unquote(open('muse-workflow/build.part2.txt').read()))")
            printf '%s%s' "$P1" "$P2" > muse-workflow/build.yml.assembled
            echo "Assembled workflow: $(wc -c < muse-workflow/build.yml.assembled) bytes"
          else
            echo "No chunks present (normal build run)"
          fi

      - name: Set up fixed debug keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -f keystore/debug.keystore.b64 ]; then
            echo "Using committed fixed debug keystore"
            base64 -d keystore/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          else
            echo "Generating fixed debug keystore (first run) and committing it back"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p keystore
            base64 -w0 "$HOME/.android/debug.keystore" > keystore/debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/debug.keystore.b64
            git commit -m "Add fixed debug keystore (base64) for stable APK signature"
            git push
          fi
          ls -la "$HOME/.android/debug.keystore"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: antiburn-lite
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-full-log.txt"

      - name: Run JVM tests
        run: |
          chmod +x antiburn-tests/run-all.sh
          ./antiburn-tests/run-all.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiburn-autoinvert
          path: antiburn-lite/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit assembled workflow back and retrigger
        if: ${{ hashFiles('muse-workflow/build.yml.assembled') != '' }}
        run: |
          mv muse-workflow/build.yml.assembled muse-workflow/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muse-workflow/build.yml
          if git diff --cached --quiet; then
            echo "Workflow already up to date"
          else
            git commit -m "Assemble fixed-key workflow (self-update)"
            git push
          fi

      - name: Publish APK to GitHub Release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp antiburn-lite/app/build/outputs/apk/debug/app-debug.apk antiburn-autoinvert.apk
          TAG="fixed-key-build"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" antiburn-autoinvert.apk --clobber
          else
            gh release create "$TAG" antiburn-autoinvert.apk --title "AntiBurn poem auto-invert (fixed signature)" --notes "Debug build with poem clock-sync auto-invert and a fixed debug signature. Uninstall any older build once, then install this one; later builds overlay-install."
          fi

      - name: Save build log on failure
        if: failure()
        run: |
          LOG="build-log-${{ github.run_number }}.txt"
          if [ -f build-full-log.txt ]; then tail -c 60000 build-full-log.txt > "$LOG"; else echo "run=${{ github.run_number }} failed at $(date -u), no gradle log captured" > "$LOG"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "Build failure log for run ${{ github.run_number }}"
          git push || true


